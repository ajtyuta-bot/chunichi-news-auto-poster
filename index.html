<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16345C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="中日ニュース">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>中日ニュース速報</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fa}
    *{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:20px 14px 48px}
    header{padding:10px 2px 18px}h1{font-size:24px;margin:0 0 7px}p{line-height:1.55}
    .muted{color:#64748b;font-size:13px}.pill{display:inline-block;border-radius:999px;padding:5px 10px;background:#e2e8f0;font-size:12px}
    .card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0f172a08}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stat{font-size:25px;font-weight:750;margin-top:5px}
    button{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:650;background:#172033;color:white;cursor:pointer}
    button:disabled{opacity:.5} .secondary{background:#e2e8f0;color:#172033;width:100%;margin-top:8px}
    .item{padding:12px 0;border-top:1px solid #e2e8f0}.item:first-child{border-top:0}.item a{color:#1557b0;overflow-wrap:anywhere}
    .status{font-size:12px;padding:4px 8px;border-radius:999px;background:#fef3c7;color:#92400e;white-space:nowrap}
    .good{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}
    .warn{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:12px;font-size:13px;line-height:1.55}
    footer{font-size:12px;color:#64748b;padding:12px}
  </style>
</head>
<body><main class="wrap">
  <header>
    <div class="pill">個人用ダッシュボード</div>
    <h1>中日ニュース X自動投稿</h1>
    <p class="muted">登録したRSS/Atomフィードから「中日ドラゴンズ」を含む記事を検出します。</p>
  </header>
  <section class="card">
    <div class="row"><div><div class="muted">監視キーワード</div><div class="stat" id="keyword">中日ドラゴンズ</div></div><div id="mode" class="pill">確認中…</div></div>
    <div class="row" style="margin-top:18px">
      <div><div class="muted">監視フィード数</div><div class="stat" id="feeds">—</div></div>
      <div><div class="muted">最新チェック</div><div id="last" style="font-weight:650">—</div></div>
    </div>
    <button id="check" class="secondary" onclick="checkNow()">今すぐチェック</button>
    <p class="muted" id="result" aria-live="polite"></p>
  </section>
  <section class="card">
    <div class="row"><h2 style="font-size:18px;margin:0">検出・投稿履歴</h2><button onclick="load()" style="padding:9px 12px">更新</button></div>
    <div id="history" style="margin-top:10px"><p class="muted">読み込み中…</p></div>
  </section>
  <div class="warn"><strong>注意：</strong>現在の設定と認証情報はサーバー側で管理します。自動投稿を有効にする前に、RSS配信元の利用条件とX APIの料金・制限を確認してください。初期設定では自動投稿はOFFです。</div>
  <footer>この画面をiPhoneのSafariで開き、「共有」→「ホーム画面に追加」でアプリのように使えます。</footer>
</main>
<script>
async function load(){
 try{
  const r=await fetch('/api/status'); const d=await r.json();
  document.getElementById('keyword').textContent=d.keyword;
  document.getElementById('feeds').textContent=d.feedCount;
  document.getElementById('mode').textContent=d.autoPost?'自動投稿 ON':'自動投稿 OFF';
  document.getElementById('mode').className='pill '+(d.autoPost?'good':'');
  document.getElementById('last').textContent=d.lastCheck?new Date(d.lastCheck).toLocaleString('ja-JP'):'未実行';
  const h=document.getElementById('history');
  if(!d.log.length) h.innerHTML='<p class="muted">まだ記事は検出されていません。</p>';
  else h.innerHTML=d.log.map(x=>`<div class="item"><div class="row"><strong>${esc(x.title)}</strong><span class="status ${x.status==='投稿済み'?'good':x.status==='投稿失敗'?'bad':''}">${esc(x.status)}</span></div><div class="muted">${esc(x.feed||'')} · ${new Date(x.detectedAt).toLocaleString('ja-JP')}</div><a href="${safeUrl(x.url)}" target="_blank" rel="noopener">記事を開く ↗</a>${x.error?`<p class="muted">${esc(x.error)}</p>`:''}</div>`).join('');
  if(d.lastError) document.getElementById('result').textContent='注意: '+d.lastError;
 }catch(e){document.getElementById('result').textContent='サーバーに接続できません。設定と起動状態を確認してください。'}
}
async function checkNow(){
 const b=document.getElementById('check');b.disabled=true;b.textContent='チェック中…';
 try{const r=await fetch('/api/check',{method:'POST'});const d=await r.json();document.getElementById('result').textContent=`チェック完了：確認 ${d.checked||0}件 / 条件一致 ${d.matches||0}件 / 投稿 ${d.posted||0}件${d.error?' / '+d.error:''}`;await load();}
 catch(e){document.getElementById('result').textContent='チェックに失敗しました。'}
 finally{b.disabled=false;b.textContent='今すぐチェック'}
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(s){try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
load();setInterval(load,30000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body></html>
