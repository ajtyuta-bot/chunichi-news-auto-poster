

<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>中日ニュース速報</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#f1f4f9;color:#182236;font-family:-apple-system,sans-serif}

header{background:#254685;color:white;padding:25px 18px}

h1{font-size:25px;margin:0 0 12px}

header p{margin:0}

main{padding:16px;max-width:760px;margin:auto}

.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px}

button{border:0;border-radius:10px;padding:13px;background:#254685;color:white;font-size:16px}

button:disabled{opacity:.5}

.news{padding:15px 0;border-top:1px solid #ddd}

.news h3{font-size:17px;line-height:1.5}

.actions{display:flex;gap:8px;flex-wrap:wrap}

.actions button{font-size:14px}

.secondary{background:#e9eef6;color:#254685}

.sub{color:#667085;font-size:13px}

a{color:#254685}

#status{margin:16px 0;white-space:pre-wrap}

</style>

</head>

<body>

<header>

<h1>中日ニュース速報</h1>

<p>最新記事からXへワンタップ投稿</p>

</header>

<main>

<section class="card">

<h2>中日ドラゴンズ最新ニュース</h2>

<button id="refresh">最新ニュースを表示</button>

<div id="status">読み込み準備完了</div>

<div id="articles"></div>

</section>

<p class="sub">

過去72時間の記事のみ表示。

投稿後は「投稿済みにする」を押してください。

</p>

</main>

<script>

'use strict';

const HOURS=72;

const KEY='dragons-posted-v3';

const query='中日ドラゴンズ when:3d';

const rss='https://news.google.com/rss/search?q='

+encodeURIComponent(query)

+'&hl=ja&gl=JP&ceid=JP:ja';

const proxies=[

'https://api.allorigins.win/raw?url='+encodeURIComponent(rss),

'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(rss),

'https://corsproxy.io/?'+encodeURIComponent(rss)

];

const statusEl=document.getElementById('status');

const list=document.getElementById('articles');

const refresh=document.getElementById('refresh');

function posted(){

try{

return JSON.parse(localStorage.getItem(KEY)||'[]');

}catch(e){return []}

}

function savePosted(url){

const a=posted();

if(!a.includes(url))a.push(url);

localStorage.setItem(KEY,JSON.stringify(a.slice(-1000)));

}

function setStatus(t){

statusEl.textContent=t;

}

async function getText(url){

const ctrl=new AbortController();

const timer=setTimeout(()=>ctrl.abort(),10000);

try{

const r=await fetch(url,{

signal:ctrl.signal,

cache:'no-store'

});

if(!r.ok)throw Error('HTTP '+r.status);

return await r.text();

}finally{

clearTimeout(timer);

}

}

function parseFeed(xml){

const doc=new DOMParser().parseFromString(xml,'application/xml');

if(doc.querySelector('parsererror'))throw Error('XML解析エラー');

const items=[...doc.querySelectorAll('item')];

if(!items.length)throw Error('記事がありません');

const now=Date.now();

return items.map(item=>({

title:item.querySelector('title')?.textContent?.trim()||'',

url:item.querySelector('link')?.textContent?.trim()||'',

date:new Date(item.querySelector('pubDate')?.textContent||'')

})).filter(x=>

x.url.startsWith('https://') &&

!isNaN(x.date.getTime()) &&

x.date.getTime()<=now &&

now-x.date.getTime()<=HOURS*3600000

).sort((a,b)=>b.date-a.date);

}

function render(items){

list.replaceChildren();

const hidden=new Set(posted());

const visible=items.filter(x=>!hidden.has(x.url));

if(!visible.length){

setStatus('過去72時間の未投稿ニュースはありません。');

return;

}

setStatus(visible.length+'件のニュースを表示しています');

for(const x of visible){

const box=document.createElement('article');

box.className='news';

const h=document.createElement('h3');

h.textContent=x.title;

const date=document.createElement('p');

date.className='sub';

date.textContent=x.date.toLocaleString('ja-JP');

const actions=document.createElement('div');

actions.className='actions';

const tweet=document.createElement('button');

tweet.textContent='Xで投稿する';

tweet.onclick=()=>{

const text=x.title+'\n'+x.url;

window.open(

'https://twitter.com/intent/tweet?text='+encodeURIComponent(text),

'_blank'

);

};

const done=document.createElement('button');

done.className='secondary';

done.textContent='投稿済みにする';

done.onclick=()=>{

savePosted(x.url);

box.remove();

if(!list.children.length)

setStatus('未投稿ニュースはありません');

};

const open=document.createElement('a');

open.href=x.url;

open.target='_blank';

open.rel='noopener noreferrer';

open.textContent='記事を読む';

actions.append(tweet,done,open);

box.append(h,date,actions);

list.append(box);

}

}

async function load(){

refresh.disabled=true;

list.replaceChildren();

setStatus('ニュースを取得しています…');

const errors=[];

for(const proxy of proxies){

try{

const xml=await getText(proxy);

const articles=parseFeed(xml);

render(articles);

refresh.disabled=false;

return;

}catch(e){

errors.push(e.message);

}

}

setStatus(

'ニュース取得エラー。\n'

+'無料の取得サービスに接続できませんでした。\n'

+'詳細：'+errors.join(' / ')

);

refresh.disabled=false;

}

refresh.addEventListener('click',load);

load();

</script>

</body>

</html>
