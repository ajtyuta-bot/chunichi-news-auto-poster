

<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>中日ニュース速報</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#f1f4f9;font-family:-apple-system,sans-serif;color:#182236}

header{background:#254685;color:white;padding:24px 18px}

h1{font-size:25px;margin:0 0 10px}

main{padding:16px;max-width:760px;margin:auto}

.card{background:white;padding:18px;border-radius:15px}

button{background:#254685;color:white;border:0;border-radius:10px;padding:13px;font-size:15px}

button:disabled{opacity:.5}

.secondary{background:#e9eef6;color:#254685}

.item{border-top:1px solid #ddd;padding:16px 0}

.item h3{font-size:17px;line-height:1.5}

.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

small{color:#667085}

a{color:#254685}

#status{white-space:pre-wrap}

</style>

</head>

<body>

<header>

<h1>中日ニュース速報</h1>

<p>過去3日間のニュースからXへ投稿</p>

</header>

<main>

<section class="card">

<h2>中日ドラゴンズ最新ニュース</h2>

<button id="refresh">ニュースを更新</button>

<p id="status">読み込み中…</p>

<div id="news"></div>

</section>

</main>

<script>

const KEY="dragons-posted-v5";

const news=document.getElementById("news");

const statusEl=document.getElementById("status");

const refresh=document.getElementById("refresh");

let articles=[];

function getPosted(){

try{return JSON.parse(localStorage.getItem(KEY)||"[]")}

catch{return []}

}

function savePosted(url){

const p=getPosted();

if(!p.includes(url))p.push(url);

localStorage.setItem(KEY,JSON.stringify(p));

}

function render(){

news.replaceChildren();

const now=Date.now();

const posted=new Set(getPosted());

const items=articles.filter(x=>{

const t=Date.parse(x.date);

return Number.isFinite(t)&&t<=now&&

now-t<=72*3600000&&!posted.has(x.url);

});

statusEl.textContent=items.length+"件の未投稿ニュース";

for(const x of items){

const div=document.createElement("div");

div.className="item";

const h=document.createElement("h3");

h.textContent=x.title;

const date=document.createElement("small");

date.textContent=new Date(x.date).toLocaleString("ja-JP");

const actions=document.createElement("div");

actions.className="actions";

const link=document.createElement("a");

link.href=x.url;

link.target="_blank";

link.rel="noopener noreferrer";

link.textContent="記事を読む";

const tweet=document.createElement("button");

tweet.textContent="Xに投稿する";

tweet.onclick=()=>{

window.open("https://twitter.com/intent/tweet?text="+

encodeURIComponent(x.title+"\n"+x.url),"_blank");

};

const done=document.createElement("button");

done.className="secondary";

done.textContent="投稿済みにする";

done.onclick=()=>{

if(confirm("Xへの投稿は完了しましたか？")){

savePosted(x.url);

render();

}

};

actions.append(link,tweet,done);

div.append(h,date,actions);

news.append(div);

}

}

async function load(){

refresh.disabled=true;

statusEl.textContent="ニュースを読み込み中…";

try{

const r=await fetch("./news.json?t="+Date.now(),{cache:"no-store"});

if(!r.ok)throw Error("HTTP "+r.status);

const data=await r.json();

if(!Array.isArray(data))throw Error("データ形式エラー");

articles=data.sort((a,b)=>Date.parse(b.date)-Date.parse(a.date));

render();

}catch(e){

statusEl.textContent="ニュース取得エラー: "+e.message+

"\nGitHub Actionsが成功しているか確認してください。";

}finally{refresh.disabled=false}

}

refresh.onclick=load;

load();

setInterval(render,60000);

</script>

</body>

</html>
