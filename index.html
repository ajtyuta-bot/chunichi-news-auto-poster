<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16458c">
<title>中日ニュース速報</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f6fb;margin:0;color:#172033}
header{background:#16458c;color:white;padding:22px 16px}
h1{font-size:22px;margin:0 0 8px}
main{padding:16px;max-width:650px;margin:auto}
.card{background:white;padding:18px;border-radius:14px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
button,a.btn{display:block;width:100%;box-sizing:border-box;padding:14px;border:0;border-radius:10px;background:#16458c;color:white;text-align:center;font-size:16px;text-decoration:none;margin-top:12px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
small{color:#667085}
</style>
</head>
<body>
<header><h1>中日ニュース速報</h1>無料・Xワンタップ投稿版</header>
<main>
<div class="card">
<h2>新着ニュースを探す</h2>
<p>中日ドラゴンズの最新ニュースを検索します。</p>
<a class="btn" href="https://news.google.com/search?q=%E4%B8%AD%E6%97%A5%E3%83%89%E3%83%A9%E3%82%B4%E3%83%B3%E3%82%BA&hl=ja&gl=JP&ceid=JP%3Aja" target="_blank" rel="noopener noreferrer">最新ニュースを見る</a>
</div>
<div class="card">
<h2>Xに投稿する</h2>
<p>記事のタイトルとURLを入力してね。</p>
<label>記事タイトル<input id="title" placeholder="中日ドラゴンズのニュース"></label>
<br><br>
<label>記事URL<input id="url" type="url" placeholder="https://..."></label>
<button onclick="post()">Xの投稿画面を開く</button>
</div>
<small>※記事の検索はGoogleニュースで行います。投稿はXで確認してから確定します。自動収集・自動投稿は行いません。</small>
</main>
<script>
function post(){
const title=document.getElementById('title').value.trim();
const url=document.getElementById('url').value.trim();
if(!title||!url){alert('記事タイトルとURLを入力してください');return;}
try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw Error();}
catch(e){alert('正しい記事URLを入力してください');return;}
const text=title+'\n'+url;
window.location.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(text);
}
</script>
</body>
</html>
